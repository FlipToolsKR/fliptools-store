<script>
if(window.innerWidth<=600) location.replace("m.html");
</script>

<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f8fafc;
  color:#111827;
  font-family:system-ui,sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:44px;
  height:44px;
}

.logo img{
  width:100%;
  height:100%;
  border-radius:14px;
}

h1{
  margin:0;
  font-size:24px;
  font-weight:800;
}

.search{
  margin-left:auto;
}

.search input{
  width:300px;
  max-width:40vw;
  border:none;
  outline:none;
  background:#eef2f7;
  padding:13px 18px;
  border-radius:999px;
  font-size:15px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:28px;
}

.hero{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:white;
  border-radius:32px;
  padding:36px;
  margin-bottom:28px;
}

.hero h2{
  margin:0;
  font-size:34px;
}

.hero p{
  margin-top:10px;
  opacity:.9;
}

.section-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:28px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.row{
  display:flex;
  gap:14px;
}

.icon{
  width:76px;
  height:76px;
  border-radius:20px;
  overflow:hidden;
  background:#eef2f7;
  flex:0 0 auto;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:19px;
  font-weight:800;
}

.desc{
  margin-top:6px;
  color:#6b7280;
  line-height:1.4;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  text-decoration:none;
  padding:11px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
}

.btn.primary{
  background:#16a34a;
  color:white;
}

.btn.secondary{
  background:#eef2ff;
  color:#1e40af;
}

.footer{
  text-align:center;
  color:#6b7280;
  padding:40px;
}

@media(max-width:700px){

  .header{
    flex-wrap:wrap;
  }

  .search{
    width:100%;
    margin-left:0;
  }

  .search input{
    width:100%;
    max-width:none;
  }

}

</style>

</head>

<body>

<div class="header">

  <div class="logo">
    <img src="/meta/icons/flipstore.png">
  </div>

  <h1>FlipStore</h1>

  <div class="search">
    <input id="q" placeholder="앱 검색">
  </div>

</div>

<div class="container">

  <div class="hero">
    <h2>FlipStore</h2>
    <p>안전하고 빠르게 APK를 다운로드하세요.</p>
  </div>

  <div class="section-title">앱</div>

  <div id="grid" class="grid"></div>

</div>

<div class="footer">
  FlipStore
</div>

<script>

let apps=[];

const grid=document.getElementById("grid");
const q=document.getElementById("q");

function esc(s){
  return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}

function card(a){

  return `
  <div class="card">

    <div class="row">

      <div class="icon">
        ${a.icon?`<img src="${esc(a.icon)}">`:""}
      </div>

      <div style="flex:1">

        <div class="name">
          ${esc(a.name||a.id)}
        </div>

        <div class="desc">
          ${esc(a.desc||"")}
        </div>

        <div class="btns">
          <a class="btn primary"
             href="app.html?id=${encodeURIComponent(a.id)}">
             상세
          </a>

          <a class="btn secondary"
             href="/apk/${encodeURIComponent(a.id)}/latest">
             다운로드
          </a>
        </div>

      </div>

    </div>

  </div>
  `;
}

function render(){

  const term=q.value.toLowerCase();

  grid.innerHTML=apps
  .filter(a=>

      !term ||

      (a.name||"")
      .toLowerCase()
      .includes(term)

      ||

      (a.id||"")
      .toLowerCase()
      .includes(term)

      ||

      (a.desc||"")
      .toLowerCase()
      .includes(term)

  )
  .map(card)
  .join("");

}

q.oninput=render;

async function load(){

  const r=await fetch(
    `/meta/index.json?t=${Date.now()}`
  );

  const d=await r.json();

  apps=d.apps||[];

  render();

}

load();

</script>

</body>
</html>
