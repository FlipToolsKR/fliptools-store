<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Detail</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f8fafc;
  color:#111827;
  font-family:system-ui,sans-serif;
}

/* header */
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:44px;
  height:44px;
}

.logo img{
  width:100%;
  height:100%;
  border-radius:14px;
}

h1{
  margin:0;
  font-size:22px;
  font-weight:800;
}

/* container */
.container{
  max-width:900px;
  margin:auto;
  padding:28px;
}

/* app hero */
.hero{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:white;
  border-radius:32px;
  padding:32px;
  margin-bottom:22px;
}

.hero h2{
  margin:0;
  font-size:32px;
}

.hero p{
  margin-top:10px;
  opacity:.9;
}

/* app info card */
.card{
  background:white;
  border-radius:28px;
  padding:22px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.row{
  display:flex;
  gap:16px;
  align-items:flex-start;
}

.icon{
  width:96px;
  height:96px;
  border-radius:22px;
  overflow:hidden;
  background:#eef2f7;
  flex:0 0 auto;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:22px;
  font-weight:800;
}

.desc{
  margin-top:10px;
  color:#6b7280;
  line-height:1.5;
}

.meta{
  margin-top:14px;
  font-size:14px;
  color:#374151;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  text-decoration:none;
  padding:11px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
}

.btn.primary{
  background:#16a34a;
  color:white;
}

.btn.secondary{
  background:#eef2ff;
  color:#1e40af;
}

.footer{
  text-align:center;
  color:#6b7280;
  padding:40px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:18px;
  border-radius:16px;
}

</style>

</head>

<body>

<div class="header">
  <div class="logo">
    <img src="/meta/icons/flipstore.png">
  </div>
  <h1>App Detail</h1>
</div>

<div class="container">

  <div id="content"></div>

</div>

<div class="footer">
  FlipStore
</div>

<script>

const content = document.getElementById("content");

function esc(s){
  return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}

function getId(){
  const p = new URLSearchParams(location.search);
  return p.get("id");
}

function renderApp(a){

  content.innerHTML = `
    <div class="hero">
      <h2>${esc(a.name || a.id)}</h2>
      <p>${esc(a.desc || "설명이 없습니다.")}</p>
    </div>

    <div class="card">

      <div class="row">

        <div class="icon">
          ${a.icon ? `<img src="${esc(a.icon)}">` : ""}
        </div>

        <div style="flex:1">

          <div class="name">${esc(a.name || a.id)}</div>

          <div class="desc">
            ${esc(a.longDesc || a.desc || "상세 정보 없음")}
          </div>

          <div class="meta">
            <div>앱 ID: ${esc(a.id)}</div>
            ${a.version ? `<div>버전: ${esc(a.version)}</div>` : ""}
            ${a.size ? `<div>크기: ${esc(a.size)}</div>` : ""}
          </div>

          <div class="btns">
            <a class="btn primary"
               href="/apk/${encodeURIComponent(a.id)}/latest.apk">
              다운로드
            </a>

            <a class="btn secondary"
               href="/">
              목록으로
            </a>
          </div>

        </div>

      </div>

    </div>
  `;
}

function renderError(){
  content.innerHTML = `
    <div class="error">
      앱 정보를 찾을 수 없습니다.
    </div>
  `;
}

async function load(){

  const id = getId();
  if(!id){
    renderError();
    return;
  }

  const r = await fetch(`/meta/index.json?t=${Date.now()}`);
  const d = await r.json();

  const apps = d.apps || [];
  const app = apps.find(a => a.id === id);

  if(!app){
    renderError();
    return;
  }

  renderApp(app);
}

load();

</script>

</body>
</html>
