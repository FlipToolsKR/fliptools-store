<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Store</title>

<style>
body{
  margin:0;
  background:#0f1115;
  color:#e6e6e6;
  font-family:system-ui, sans-serif;
}

.header{
  padding:16px 20px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:32px;height:32px;border-radius:10px;
  background:#3b82f6;
}

h1{font-size:18px;margin:0;font-weight:700}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#16181d;
  border:1px solid #262a33;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.row{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.icon{
  width:64px;height:64px;
  border-radius:14px;
  background:#222;
  overflow:hidden;
  flex:0 0 auto;
}
.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.name{
  font-weight:800;
  font-size:18px;
}

.meta{
  color:#aaa;
  font-size:13px;
  margin-top:6px;
  line-height:1.4;
}

.btns{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  background:#232730;
  border:1px solid #333;
  padding:8px 12px;
  border-radius:10px;
  text-decoration:none;
  color:white;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.btn.primary{
  background:#3b82f6;
  border:none;
}

.btn:active{transform:translateY(1px)}

.small{
  font-size:12px;
  color:#aaa;
  margin-top:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:8px;
}
th,td{
  padding:10px 8px;
  border-top:1px solid #262a33;
  text-align:left;
  font-size:13px;
  vertical-align:top;
}
th{color:#bdbdbd;font-weight:700}

.code{
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size:12px;
  color:#cfcfcf;
  word-break:break-all;
  white-space:normal;
}

.pill{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  background:#232730;
  border:1px solid #333;
  font-size:12px;
  color:#cfcfcf;
}

.toplink{
  margin-left:auto;
  display:flex;
  gap:8px;
  align-items:center;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo"></div>
  <h1>FlipTools Store</h1>
  <div class="toplink">
    <a class="btn" href="index.html">← 목록</a>
    <a class="btn" id="metaLink" href="#" target="_blank">meta</a>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="row">
      <div class="icon" id="iconBox"></div>
      <div style="flex:1">
        <div class="name" id="appName">Loading…</div>
        <div class="meta" id="appDesc"></div>
        <div class="small">
          <span class="pill" id="appId">id: -</span>
          <span class="pill" id="latestPill">latest: -</span>
        </div>

        <div class="btns">
          <a class="btn primary" id="latestBtn" href="#">최신 다운로드</a>
          <a class="btn" id="directMetaBtn" href="#" target="_blank">앱 메타 보기</a>
        </div>

        <div class="small">
          최신 엔드포인트: <span class="code" id="latestEp"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-weight:800;">버전 목록</div>
      <span class="pill" id="countPill">0</span>
    </div>

    <div style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th style="width:110px;">버전</th>
            <th style="width:120px;">날짜</th>
            <th>변경점</th>
            <th style="width:260px;">SHA256</th>
            <th style="width:200px;"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const qs = new URLSearchParams(location.search);
const id = qs.get("id");

const iconBox = document.getElementById("iconBox");
const appName = document.getElementById("appName");
const appDesc = document.getElementById("appDesc");
const appId = document.getElementById("appId");
const latestPill = document.getElementById("latestPill");
const latestBtn = document.getElementById("latestBtn");
const latestEp = document.getElementById("latestEp");
const tbody = document.getElementById("tbody");
const countPill = document.getElementById("countPill");
const metaLink = document.getElementById("metaLink");
const directMetaBtn = document.getElementById("directMetaBtn");

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function setIcon(url){
  if(!url){
    iconBox.style.background = "#222";
    iconBox.innerHTML = "";
    return;
  }
  iconBox.innerHTML = `<img src="${esc(url)}" alt="" onerror="this.style.display='none';">`;
}

async function getIndexIcon(appId){
  try{
    const r = await fetch(`/meta/index.json?t=${Date.now()}`, { cache:"no-store" });
    if(!r.ok) return "";
    const data = await r.json();
    const apps = Array.isArray(data.apps) ? data.apps : [];
    const found = apps.find(a => a.id === appId);
    return found?.icon || "";
  }catch{
    return "";
  }
}

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-copy]");
  if(!btn) return;

  const text = btn.getAttribute("data-copy") || "";
  try{
    await navigator.clipboard.writeText(text);
    btn.textContent = "복사됨!";
    setTimeout(() => btn.textContent = "복사", 900);
  }catch{
    prompt("SHA256 복사:", text);
  }
});

async function main(){
  if(!id){
    appName.textContent = "id 없음";
    return;
  }

  const latestUrl = `/apk/${encodeURIComponent(id)}/latest`;
  latestBtn.href = latestUrl;
  latestEp.textContent = latestUrl;

  const metaUrl = `/meta/apps/${encodeURIComponent(id)}.json`;
  directMetaBtn.href = metaUrl;
  metaLink.href = metaUrl;

  let data;
  try{
    const r = await fetch(`${metaUrl}?t=${Date.now()}`, { cache:"no-store" });
    if(!r.ok) throw new Error("meta fetch failed");
    data = await r.json();
  }catch(e){
    appName.textContent = "앱 메타 로드 실패";
    appDesc.textContent = metaUrl;
    return;
  }

  const name = data.name || data.id || id;
  appName.textContent = name;
  appDesc.textContent = data.desc || "";
  appId.textContent = `id: ${data.id || id}`;
  latestPill.textContent = `latest: ${data.latest || "-"}`;

  let icon = data.icon || "";
  if(!icon) icon = await getIndexIcon(data.id || id);
  setIcon(icon);

  const versions = Array.isArray(data.versions) ? data.versions : [];
  countPill.textContent = String(versions.length);
  tbody.innerHTML = "";

  if(!versions.length){
    tbody.innerHTML = `<tr><td colspan="5" style="color:#aaa;">버전 정보 없음</td></tr>`;
    return;
  }

  for(const v of versions){
    const ver = v.version || "";
    const pub = v.published || "";
    const log = v.changelog || "";
    const sha = v.sha256 || "";
    const apk = v.apk || `/apk/${id}/${ver}.apk`;

    const latestMark = (ver === data.latest) ? ` <span class="pill">LATEST</span>` : "";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><b>${esc(ver)}</b>${latestMark}</td>
      <td style="color:#aaa;">${esc(pub)}</td>
      <td>${esc(log)}</td>
      <td class="code">${esc(sha)}</td>
      <td>
        <a class="btn" href="${esc(apk)}">다운로드</a>
        ${sha ? `<button class="btn" type="button" data-copy="${esc(sha)}">복사</button>` : ""}
      </td>
    `;
    tbody.appendChild(tr);
  }
}

main();
</script>

</body>
</html>
