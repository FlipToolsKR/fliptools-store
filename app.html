<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>

*{
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  margin:0;
  background:#f6f8fc;
}

.header{
  position:sticky;
  top:0;
  background:white;
  padding:14px 18px;
  font-weight:800;
  border-bottom:1px solid #e5e7eb;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:24px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:14px;
}

.icon{
  width:84px;
  height:84px;
  border-radius:20px;
  overflow:hidden;
  background:#eef2f7;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.row{
  display:flex;
  gap:14px;
}

.name{
  font-size:22px;
  font-weight:800;
}

.desc{
  color:#6b7280;
  margin-top:6px;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  padding:10px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:700;
  font-size:13px;
}

.primary{
  background:#16a34a;
  color:white;
}

.secondary{
  background:#eef2ff;
  color:#1e40af;
}

.version{
  padding:14px;
  background:#f9fafb;
  border-radius:16px;
  margin-bottom:10px;
}

.ver-title{
  font-weight:800;
}

.meta{
  font-size:12px;
  color:#6b7280;
  margin-top:6px;
}

</style>
</head>

<body>

<div class="header">App Detail</div>

<div class="container">

  <div class="card">
    <div class="row">
      <div class="icon" id="icon"></div>

      <div style="flex:1">
        <div class="name" id="name"></div>
        <div class="desc" id="desc"></div>

        <div class="btns">
          <a class="btn primary" id="latestBtn" href="#" aria-label="Download latest APK">
            다운로드
          </a>
        </div>

      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:800">전체 버전</div>
    <div id="versions"></div>
  </div>

</div>

<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) { alert("앱 ID가 없습니다."); return; }
  const iconEl = document.getElementById("icon");
  const nameEl = document.getElementById("name");
  const descEl = document.getElementById("desc");
  const latestBtn = document.getElementById("latestBtn");
  const versionsEl = document.getElementById("versions");
  try {
    const r = await fetch(`/meta/apps/${encodeURIComponent(id)}.json`);
    if (!r.ok) throw new Error("앱 메타 정보를 찾을 수 없습니다.");
    const data = await r.json();
    nameEl.textContent = data.name || id;
    descEl.textContent = data.desc || "";
    iconEl.innerHTML = `<img src="${data.icon || "/meta/icons/"+id+".png"}" alt="앱 아이콘">`;
    const versions = data.versions || [];
    const latest = versions[versions.length - 1];
    if (latest) {
      const latestApk = latest.apk || `/apk/${id}/${latest.version}.apk`;
      latestBtn.href = latestApk;
      latestBtn.style.display = "inline-block";
    } else { latestBtn.style.display = "none"; }
    const html = versions.map(v => `
      <div class="version">
        <div class="ver-title">${v.version}</div>
        <div class="meta">${v.changelog || ""}</div>
        <div class="btns"><a class="btn primary" href="${v.apk || `/apk/${id}/${v.version}.apk`}">다운로드</a></div>
      </div>`).join("");
    versionsEl.innerHTML = html;
  } catch (e) {
    console.error(e);
    versionsEl.innerHTML = `<div class="meta">오류: ${e.message}</div>`;
    latestBtn.style.display = "none";
  }
})();
</script>

</body>
</html>
