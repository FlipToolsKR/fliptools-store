<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>

*{
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  margin:0;
  background:#f6f8fc;
}

.header{
  position:sticky;
  top:0;
  background:white;
  padding:14px 18px;
  font-weight:800;
  border-bottom:1px solid #e5e7eb;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:24px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:14px;
}

.icon{
  width:84px;
  height:84px;
  border-radius:20px;
  overflow:hidden;
  background:#eef2f7;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.row{
  display:flex;
  gap:14px;
}

.name{
  font-size:22px;
  font-weight:800;
}

.desc{
  color:#6b7280;
  margin-top:6px;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  padding:10px 14px;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
  font-size:13px;
}

.primary{
  background:#16a34a;
  color:white;
}

.secondary{
  background:#eef2ff;
  color:#1e40af;
}

.version{
  padding:14px;
  background:#f9fafb;
  border-radius:16px;
  margin-bottom:10px;
}

.ver-title{
  font-weight:800;
}

.meta{
  font-size:12px;
  color:#6b7280;
  margin-top:6px;
}

</style>
</head>

<body>

<div class="header">App Detail</div>

<div class="container">

  <div class="card">
    <div class="row">
      <div class="icon" id="icon"></div>

      <div style="flex:1">
        <div class="name" id="name"></div>
        <div class="desc" id="desc"></div>

        <div class="btns">
          <a class="btn primary" id="latestBtn" href="#">
            다운로드
          </a>
        </div>

      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:800">전체 버전</div>
    <div id="versions"></div>
  </div>

</div>

<script>

const id = new URLSearchParams(location.search).get("id");

const icon = document.getElementById("icon");
const nameEl = document.getElementById("name");
const descEl = document.getElementById("desc");
const latestBtn = document.getElementById("latestBtn");
const versionsEl = document.getElementById("versions");

fetch(`/meta/apps/${id}.json`)
.then(r=>r.json())
.then(data=>{

  nameEl.textContent = data.name || id;
  descEl.textContent = data.desc || "";

  icon.innerHTML =
    `<img src="${data.icon || "/meta/icons/"+id+".png"}">`;

  const versions = data.versions || [];

  // 최신 버전 = 마지막 요소
  const latest = versions[versions.length - 1];

  if(latest){
    const latestApk =
      latest.apk || `/apk/${id}/${latest.version}.apk`;

    latestBtn.href = latestApk;
  }

  let html="";

  versions.forEach(v=>{

    const apk =
      v.apk || `/apk/${id}/${v.version}.apk`;

    html += `
      <div class="version">

        <div class="ver-title">
          ${v.version}
        </div>

        <div class="meta">
          ${v.changelog || ""}
        </div>

        <div class="btns">
          <a class="btn primary" href="${apk}">
            다운로드
          </a>
        </div>

      </div>
    `;

  });

  versionsEl.innerHTML = html;

});

</script>

</body>
</html>
