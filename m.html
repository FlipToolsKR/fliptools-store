<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>

*{
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  margin:0;
  background:#f6f8fc;
  color:#1f1f1f;
}

/* header */
.header{
  position:sticky;
  top:0;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:100;
}

.title{
  font-size:20px;
  font-weight:800;
}

/* container */
.container{
  padding:16px;
}

/* card */
.card{
  background:white;
  border-radius:24px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:12px;
  display:flex;
  gap:14px;
  align-items:flex-start;
  text-decoration:none;
  color:inherit;
}

.icon{
  width:64px;
  height:64px;
  border-radius:18px;
  overflow:hidden;
  background:#eef2f7;
  flex:0 0 auto;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:18px;
  font-weight:800;
}

.desc{
  font-size:13px;
  color:#6b7280;
  margin-top:6px;
  line-height:1.4;
}

.meta{
  font-size:12px;
  color:#9ca3af;
  margin-top:8px;
}

.search{
  width:100%;
  margin-top:10px;
}

.search input{
  width:100%;
  padding:12px 14px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#eef2f7;
  font-size:14px;
}

.err{
  color:#dc2626;
  padding:10px 16px;
}

</style>
</head>

<body>

<div class="header">
  <div class="title">FlipStore</div>
</div>

<div class="container">

  <div class="search">
    <input id="q" placeholder="앱 검색">
  </div>

  <div id="list"></div>

  <div class="err" id="err"></div>

</div>

<script>
(async()=>{
  const fetchBoth=async url=>{try{const r=await fetch(url);if(!r.ok)return[];const d=await r.json();return d.apps||[];}catch{return[];}};
  let basePath='';
if(location.pathname.includes('/LG/')||location.pathname.includes('/fliptools-files/')){
  basePath='';
}else if(location.pathname.includes('LG')||location.pathname.includes('fliptools-files')){
  basePath='/LG';
}
  const storeApps=await fetchBoth(`${basePath}/meta/index.json`);
  const fileApps=await fetchBoth(`${basePath}/fliptools-files/meta/index.json`);
  const map=new Map();
  storeApps.forEach(a=>map.set(a.id,a));
  fileApps.forEach(a=>{if(!map.has(a.id))map.set(a.id,a);});
  const apps=Array.from(map.values());
  const list=document.getElementById('list');
  const q=document.getElementById('q');
  const err=document.getElementById('err');
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function render(){
    const term=q.value.toLowerCase();
    let html='';
    apps.filter(a=>!term||[a.name,a.id,a.desc].some(v=>v&&v.toLowerCase().includes(term)))
        .forEach(a=>{
      const icon=a.icon||`${basePath}/meta/icons/${a.id}.png`;
      html+=`
      <a class="card" href="m_app.html?id=${encodeURIComponent(a.id)}">
        <div class="icon"><img src="${esc(icon)}" alt="${esc(a.name||a.id)} 아이콘"></div>
        <div style="flex:1">
          <div class="name">${esc(a.name||a.id)}</div>
          <div class="desc">${esc(a.desc||'')}</div>
          <div class="meta">${esc(a.id)}</div>
          <button class="btn" style="margin-top:4px;" onclick="toggleVersions('${a.id}', this)">버전</button>
          <div class="version-list" style="display:none;"></div>
        </div>
      </a>`;
    });
    list.innerHTML=html;
  }
  q.oninput=render;
  async function toggleVersions(id, btn){
    const container=btn.nextElementSibling;
    if(container.style.display==='block'){container.style.display='none';return;}
    const r=await fetch(`${basePath}/meta/apps/${encodeURIComponent(id)}.json`);
    if(!r.ok){container.innerHTML='<div class="err">버전 정보를 불러올 수 없습니다.</div>';container.style.display='block';return;}
    const data=await r.json();
    const html=data.versions?.map(v=>`<a class="btn" href="${v.apk||`${basePath}/apk/${id}/${v.version}.apk`}">${v.version}</a>`).join('')||'';
    container.innerHTML=html;container.style.display='block';
  }
  render();
})();

(function(){

var list=document.getElementById("list");
var q=document.getElementById("q");
var err=document.getElementById("err");

var apps=[];

function esc(s){
  return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}

function render(){

  var term=q.value.toLowerCase();

  var html="";

  apps
  .filter(function(a){

    if(!term) return true;

    return (
      (a.name||"").toLowerCase().includes(term) ||
      (a.id||"").toLowerCase().includes(term) ||
      (a.desc||"").toLowerCase().includes(term)
    );

  })
  .forEach(function(a){

    var icon =
      a.icon ||
      "/meta/icons/"+a.id+".png";

    html+=`
    <a class="card"
       href="m_app.html?id=${encodeURIComponent(a.id)}">

      <div class="icon">
        <img src="${esc(icon)}">
      </div>

      <div style="flex:1">

        <div class="name">
          ${esc(a.name||a.id)}
        </div>

        <div class="desc">
          ${esc(a.desc||"")}
        </div>

        <div class="meta">
          ${esc(a.id)}
        </div>

      </div>

    </a>
    `;

  });

  list.innerHTML=html;

}

q.oninput=render;

function load(){

  /* var xhr=new XMLHttpRequest();

  xhr.open("GET","/meta/index.json?t="+Date.now(),true);

  xhr.onreadystatechange=function(){

    if(xhr.readyState!==4) return;

      err.textContent="앱 목록 로드 실패";
      return;
    }

    var data=JSON.parse(xhr.responseText);

    apps=data.apps||[];

    render();

  };

  xhr.send();

}

load(); */

})();

</script>

</body>
</html>
