<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>

*{
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  margin:0;
  background:#f6f8fc;
  color:#1f1f1f;
}

/* header */
.header{
  position:sticky;
  top:0;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:100;
}

.title{
  font-size:20px;
  font-weight:800;
}

/* container */
.container{
  padding:16px;
}

/* card */
.card{
  background:white;
  border-radius:24px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:12px;
  display:flex;
  gap:14px;
  align-items:flex-start;
  text-decoration:none;
  color:inherit;
}

.icon{
  width:64px;
  height:64px;
  border-radius:18px;
  overflow:hidden;
  background:#eef2f7;
  flex:0 0 auto;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:18px;
  font-weight:800;
}

.desc{
  font-size:13px;
  color:#6b7280;
  margin-top:6px;
  line-height:1.4;
}

.meta{
  font-size:12px;
  color:#9ca3af;
  margin-top:8px;
}

.search{
  width:100%;
  margin-top:10px;
}

.search input{
  width:100%;
  padding:12px 14px;
  border-radius:999px;
  border:none;
  outline:none;
  background:#eef2f7;
  font-size:14px;
}

.err{
  color:#dc2626;
  padding:10px 16px;
}

</style>
</head>

<body>

<div class="header">
  <div class="title">FlipStore</div>
</div>

<div class="container">

  <div class="search">
    <input id="q" placeholder="앱 검색">
  </div>

  <div id="list"></div>

  <div class="err" id="err"></div>

</div>

<script>

(function(){

var list=document.getElementById("list");
var q=document.getElementById("q");
var err=document.getElementById("err");

var apps=[];

function esc(s){
  return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}

function render(){

  var term=q.value.toLowerCase();

  var html="";

  apps
  .filter(function(a){

    if(!term) return true;

    return (
      (a.name||"").toLowerCase().includes(term) ||
      (a.id||"").toLowerCase().includes(term) ||
      (a.desc||"").toLowerCase().includes(term)
    );

  })
  .forEach(function(a){

    var icon =
      a.icon ||
      "/meta/icons/"+a.id+".png";

    html+=`
    <a class="card"
       href="m_app.html?id=${encodeURIComponent(a.id)}">

      <div class="icon">
        <img src="${esc(icon)}">
      </div>

      <div style="flex:1">

        <div class="name">
          ${esc(a.name||a.id)}
        </div>

        <div class="desc">
          ${esc(a.desc||"")}
        </div>

        <div class="meta">
          ${esc(a.id)}
        </div>

      </div>

    </a>
    `;

  });

  list.innerHTML=html;

}

q.oninput=render;

function load(){

  var xhr=new XMLHttpRequest();

  xhr.open("GET","/meta/index.json?t="+Date.now(),true);

  xhr.onreadystatechange=function(){

    if(xhr.readyState!==4) return;

    if(xhr.status!==200){
      err.textContent="앱 목록 로드 실패";
      return;
    }

    var data=JSON.parse(xhr.responseText);

    apps=data.apps||[];

    render();

  };

  xhr.send();

}

load();

})();

</script>

</body>
</html>
