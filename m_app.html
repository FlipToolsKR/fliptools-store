<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>

body{
  margin:0;
  font-family:system-ui;
  background:#f6f8fc;
}

.header{
  padding:14px;
  font-weight:800;
  background:white;
  border-bottom:1px solid #e5e7eb;
}

.container{
  padding:14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
}

.icon{
  width:72px;
  height:72px;
  border-radius:18px;
  overflow:hidden;
}

.icon img{
  width:100%;
  height:100%;
}

.name{
  font-size:20px;
  font-weight:800;
}

.desc{
  font-size:13px;
  color:#6b7280;
  margin-top:6px;
}

.btn{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:12px;
  border-radius:8px;
  font-weight:800;
  text-decoration:none;
}

.primary{
  background:#16a34a;
  color:white;
}

.version{
  background:#f9fafb;
  padding:12px;
  border-radius:14px;
  margin-top:10px;
}

.ver-title{
  font-weight:700;
}

</style>
</head>

<body>

<div class="header">FlipStore</div>

<div class="container">

  <div class="card">
    <div class="icon" id="icon"></div>
    <div class="name" id="name"></div>
    <div class="desc" id="desc"></div>

    <a class="btn primary" id="latestBtn" href="#">
      다운로드
    </a>
  </div>

  <div class="card">
    <div style="font-weight:800">전체 버전</div>
    <div id="versions"></div>
  </div>

</div>

<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) { alert("앱 ID가 없습니다."); return; }
  const iconEl = document.getElementById("icon");
  const nameEl = document.getElementById("name");
  const descEl = document.getElementById("desc");
  const latestBtn = document.getElementById("latestBtn");
  const versionsEl = document.getElementById("versions");
  try {
    const r = await fetch(`/meta/apps/${encodeURIComponent(id)}.json`);
    if (!r.ok) throw new Error("앱 메타 정보를 찾을 수 없습니다.");
    const data = await r.json();
    nameEl.textContent = data.name || id;
    descEl.textContent = data.desc || "";
    iconEl.innerHTML = `<img src="${data.icon || "/meta/icons/"+id+".png"}" alt="앱 아이콘">`;
    const versions = data.versions || [];
    const latest = versions[versions.length - 1];
    if (latest) {
      latestBtn.href = latest.apk || `/apk/${id}/${latest.version}.apk`;
      latestBtn.style.display = "inline-block";
    } else { latestBtn.style.display = "none"; }
    const html = versions.map(v => `
      <div class="version">
        <div class="ver-title">${v.version}</div>
        <a class="btn primary" href="${v.apk || `/apk/${id}/${v.version}.apk`}">다운로드</a>
      </div>`).join("");
    versionsEl.innerHTML = html;
  } catch (e) {
    console.error(e);
    versionsEl.innerHTML = `<div class="meta">오류: ${e.message}</div>`;
    latestBtn.style.display = "none";
  }
})();
</script>

</body>
</html>
