<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flip Store</title>
<style>
  body{margin:0;background:#0f1115;color:#e6e6e6;font-family:system-ui,sans-serif}
  .top{padding:8px;border-bottom:1px solid #222;display:flex;gap:8px;align-items:center}
  .t{font-size:14px;font-weight:800}
  .box{padding:8px}
  .card{background:#16181d;border:1px solid #262a33;border-radius:10px;padding:8px;margin-top:8px}
  .row{display:flex;gap:6px;align-items:center}
  .icon{width:32px;height:32px;border-radius:6px;background:#222;overflow:hidden;flex:0 0 auto}
  .icon img{width:100%;height:100%;object-fit:cover;display:block}
  .name{font-size:13px;font-weight:800}
  .desc{font-size:11px;color:#aaa;margin-top:3px;line-height:1.35}
  .pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#232730;border:1px solid #333;font-size:11px;color:#cfcfcf;margin-top:6px}
  .btns{margin-top:7px; display:flex; gap:6px; flex-wrap:wrap}
  a,button{display:inline-block;padding:6px 8px;background:#232730;border:1px solid #333;border-radius:8px;color:#fff;text-decoration:none;font-size:11px}
  a.primary,button.primary{background:#3b82f6;border:none}
  button{cursor:pointer}
  .err{margin-top:10px;color:#ffb4b4;font-size:12px;white-space:pre-wrap}
  .hr{height:1px;background:#262a33;margin:8px 0}
  .ver{font-size:12px;font-weight:800}
  .meta{font-size:11px;color:#aaa;margin-top:2px;line-height:1.35}
  .mono{font-family:monospace;word-break:break-all;font-size:11px;color:#d6d6d6;margin-top:4px}
</style>
</head>
<body>
  <div class="top">
    <a href="m.html" class="primary">←</a>
    <div class="t">상세</div>
  </div>

  <div class="box">
    <div id="appCard" class="card">
      <div class="row">
        <div class="icon" id="iconBox"></div>
        <div style="flex:1">
          <div class="name" id="appName">Loading…</div>
        </div>
      </div>
      <div class="desc" id="appDesc"></div>
      <div class="pill" id="latestPill">latest: -</div>

      <div class="btns">
        <a class="primary" id="latestBtn" href="#">길게 눌러 저장</a>
        <a id="metaBtn" href="#" target="_blank">meta</a>
      </div>

      <div id="err" class="err"></div>
    </div>

    <div class="card">
      <div class="name">버전</div>
      <div id="versions"></div>
    </div>
  </div>

<script>
(function(){
  function qs(name){
    var m = new RegExp("[?&]"+name+"=([^&]+)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }

  var RAW_BASE = "https://flipstore-web.pages.dev/apk/";

  var id = qs("id");
  var iconBox = document.getElementById("iconBox");
  var appName = document.getElementById("appName");
  var appDesc = document.getElementById("appDesc");
  var latestPill = document.getElementById("latestPill");
  var latestBtn = document.getElementById("latestBtn");
  var metaBtn = document.getElementById("metaBtn");
  var versionsEl = document.getElementById("versions");
  var err = document.getElementById("err");

  function esc(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function setIcon(url){
    if(!url){
      iconBox.innerHTML = "";
      iconBox.style.background = "#222";
      return;
    }
    iconBox.innerHTML = '<img src="'+esc(url)+'?t='+Date.now()+'">';
  }

  function copyText(text){
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){}
    prompt("복사:", text);
    return true;
  }

  if(!id){
    appName.textContent = "id 없음";
    return;
  }

  metaBtn.href = "/meta/apps/" + encodeURIComponent(id) + ".json";

  function rawUrlFor(id, ver){
    if(!id || !ver) return "#";
    return RAW_BASE + encodeURIComponent(id) + "/" + encodeURIComponent(ver) + ".apk";
  }

  function renderVersions(data){
    var versions = data.versions || [];
    if(!versions.length){
      versionsEl.innerHTML = '<div class="meta">버전 정보 없음</div>';
      return;
    }

    var out = [];
    for(var i=0;i<versions.length;i++){
      var v = versions[i] || {};
      var ver = v.version || "";
      var pub = v.published || "";
      var log = v.changelog || "";
      var sha = v.sha256 || "";

      // v.apk가 절대경로(https://...)로 들어있으면 그거 우선, 아니면 raw 조합
      var apk = v.apk;
      if(!apk) apk = rawUrlFor(id, ver);

      out.push(
        '<div class="hr"></div>' +
        '<div class="ver">'+esc(ver)+'</div>' +
        (pub ? '<div class="meta">날짜: '+esc(pub)+'</div>' : '') +
        (log ? '<div class="meta">'+esc(log)+'</div>' : '') +
        (sha ? '<div class="mono">'+esc(sha)+'</div>' : '') +
        '<div class="btns">' +
          '<a class="primary" href="'+esc(apk)+'">길게 눌러 저장</a>' +
          (sha ? '<button type="button" onclick="window.__copySha('+i+')">SHA 복사</button>' : '') +
        '</div>'
      );
    }
    versionsEl.innerHTML = out.join("");

    window.__shaList = [];
    for(var j=0;j<versions.length;j++){
      window.__shaList[j] = (versions[j] && versions[j].sha256) ? versions[j].sha256 : "";
    }
    window.__copySha = function(idx){
      var t = window.__shaList[idx] || "";
      if(t) copyText(t);
    };
  }

  function loadMeta(){
    err.textContent = "";
    var url = "/meta/apps/" + encodeURIComponent(id) + ".json?t=" + Date.now();

    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState !== 4) return;

      if(xhr.status !== 200){
        err.textContent = "로드 실패: " + url + " (" + xhr.status + ")";
        appName.textContent = id;
        appDesc.textContent = "";
        setIcon("/meta/icons/" + id + ".png");
        return;
      }

      try{
        var data = JSON.parse(xhr.responseText);

        var name = data.name || data.id || id;
        appName.textContent = name;
        appDesc.textContent = data.desc || "";

        var latest = data.latest || "";
        latestPill.textContent = "latest: " + (latest || "-");
        latestBtn.href = latest ? rawUrlFor(id, latest) : "#";

        var icon = data.icon || "";
        if(!icon) icon = "/meta/icons/" + id + ".png";
        setIcon(icon);

        renderVersions(data);

      }catch(e){
        err.textContent = "JSON 파싱 실패: " + e;
      }
    };
    xhr.send(null);
  }

  loadMeta();
})();
</script>
</body>
</html>
