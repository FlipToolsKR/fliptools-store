<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlipStore</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f6f8fc;
  color:#1f1f1f;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#eef2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#111;
  font-size:20px;
  font-weight:700;
}

.logo{
  width:34px;
  height:34px;
}

.logo img{
  width:100%;
  height:100%;
  border-radius:10px;
}

.title{
  font-size:18px;
  font-weight:800;
}

.container{
  padding:16px;
}

.card{
  background:white;
  border-radius:28px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:16px;
}

.row{
  display:flex;
  gap:14px;
}

.icon{
  width:72px;
  height:72px;
  border-radius:20px;
  overflow:hidden;
  background:#eef2f7;
  flex:0 0 auto;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:20px;
  font-weight:800;
}

.desc{
  color:#6b7280;
  margin-top:6px;
  line-height:1.4;
  font-size:14px;
}

.pill{
  display:inline-block;
  margin-top:12px;
  padding:8px 14px;
  border-radius:999px;
  background:#eef2f7;
  font-size:13px;
}

.btns{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn{
  text-decoration:none;
  border:none;
  cursor:pointer;
  padding:12px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
}

.primary{
  background:#16a34a;
  color:white;
}

.secondary{
  background:#eef2ff;
  color:#1e40af;
}

.section-title{
  font-size:18px;
  font-weight:800;
}

.version{
  border-top:1px solid #e5e7eb;
  padding:16px 0;
}

.version:first-child{
  border-top:none;
}

.ver{
  font-size:16px;
  font-weight:800;
}

.meta{
  color:#6b7280;
  font-size:13px;
  margin-top:6px;
  line-height:1.5;
}

.mono{
  margin-top:8px;
  font-size:12px;
  font-family:monospace;
  word-break:break-all;
  color:#444;
}

.err{
  color:#dc2626;
  margin-top:12px;
}
</style>
</head>
<body>

<div class="header">
  <a href="m.html" class="back">←</a>

  <div class="logo">
    <img src="/meta/icons/flipstore.png">
  </div>

  <div class="title">FlipStore</div>
</div>

<div class="container">

  <div class="card">

    <div class="row">

      <div class="icon" id="iconBox"></div>

      <div style="flex:1">

        <div class="name" id="appName">
          Loading...
        </div>

        <div class="desc" id="appDesc"></div>

        <div class="pill" id="latestPill">
          latest: -
        </div>

      </div>

    </div>

    <div class="btns">
      <a class="btn primary" id="latestBtn" href="#">
        다운로드
      </a>

      <a class="btn secondary"
         id="metaBtn"
         href="#"
         target="_blank">
         메타
      </a>
    </div>

    <div class="err" id="err"></div>

  </div>

  <div class="card">

    <div class="section-title">
      버전
    </div>

    <div id="versions"></div>

  </div>

</div>

<script>

(function(){

function qs(name){
  return new URLSearchParams(location.search).get(name)||"";
}

var id = qs("id");

var iconBox = document.getElementById("iconBox");
var appName = document.getElementById("appName");
var appDesc = document.getElementById("appDesc");
var latestPill = document.getElementById("latestPill");
var latestBtn = document.getElementById("latestBtn");
var metaBtn = document.getElementById("metaBtn");
var versionsEl = document.getElementById("versions");
var err = document.getElementById("err");

function esc(s){
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function setIcon(url){
  if(!url){
    iconBox.innerHTML="";
    return;
  }

  iconBox.innerHTML =
    '<img src="'+esc(url)+'?t='+Date.now()+'">';
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    prompt("복사", text);
  }
}

if(!id){
  appName.textContent="id 없음";
  return;
}

metaBtn.href =
  "/meta/apps/"+encodeURIComponent(id)+".json";

function renderVersions(data){

  const versions = data.versions || [];

  if(!versions.length){
    versionsEl.innerHTML =
      '<div class="meta">버전 정보 없음</div>';
    return;
  }

  versionsEl.innerHTML = versions.map(v => {

    const apk =
      v.apk || `/apk/${id}/${v.version}.apk`;

    return `
      <div class="version">

        <div class="ver">
          ${esc(v.version || "-")}
        </div>

        <div class="meta">
          ${esc(v.published || "")}
        </div>

        <div class="meta">
          ${esc(v.changelog || "")}
        </div>

        ${v.sha256 ?
          `<div class="mono">${esc(v.sha256)}</div>`
          : ""}

        <div class="btns">

          <a class="btn primary"
             href="${esc(apk)}">
             다운로드
          </a>

          ${v.sha256 ?
          `<button class="btn secondary"
             onclick="copySha('${esc(v.sha256)}')">
             SHA 복사
           </button>`
          : ""}

        </div>

      </div>
    `;

  }).join("");
}

window.copySha = function(sha){
  copyText(sha);
};

async function load(){

  try{

    const r = await fetch(
      `/meta/apps/${encodeURIComponent(id)}.json?t=${Date.now()}`
    );

    if(!r.ok)
      throw new Error("메타 로드 실패");

    const data = await r.json();

    appName.textContent =
      data.name || data.id || id;

    appDesc.textContent =
      data.desc || "";

    latestPill.textContent =
      "latest: " + (data.latest || "-");

    latestBtn.href =
      data.versions?.[0]?.apk ||
      `/apk/${id}/${data.latest}.apk`;

    setIcon(
      data.icon ||
      `/meta/icons/${id}.png`
    );

    renderVersions(data);

  }catch(e){

    err.textContent = e.message;

    appName.textContent = id;

    setIcon(`/meta/icons/${id}.png`);
  }
}

load();

})();
</script>

</body>
</html>
